 "tiktoken"], "group": "providers", "sz": 33, "body": "# OpenAI Embedding Provider\n\n**File:** `chunkhound/providers/embeddings/openai_provider.py`\n\n## Models\n\n| Model | Dimensions | Use case |\n|-------|-----------|---------|\n| `text-embedding-3-small` | 1536 | Faster, cheaper, good quality |\n| `text-embedding-3-large` | 3072 | Higher quality, higher cost |\n| `text-embedding-ada-002` | 1536 | Legacy (not recommended for new projects) |\n\n## Configuration\n\n```json\n{\n  \"embedding\": {\n    \"provider\": \"openai\",\n    \"model\": \"text-embedding-3-small\",\n    \"api_key\": \"sk-...\",\n    \"batch_size\": 2000,\n    \"base_url\": null\n  }\n}\n```\n\n## Key Specs\n\n| Parameter | Value |\n|-----------|-------|\n| `batch_size` | 2000 texts per API request |\n| `max_tokens` | 8191 tokens per text |\n| `distance` | cosine |\n| `supports_reranking` | Only if custom `/rerank` endpoint configured |\n| `recommended_concurrency` | 8 concurrent batch requests |\n\n## Token Counting\n\nUses `tiktoken` for exact token counting before batching. If `tiktoken` is not\ninstalled, falls back to `len(text) / 4` (approximate). Chunks exceeding\n`max_tokens` were already split by [cAST Chunking](/algorithms/cast-chunking.md).\n\n## Azure OpenAI Support\n\nSet `base_url` to your Azure endpoint and use an Azure API key. The provider\nauto-detects Azure vs. standard OpenAI from the `base_url` format.\n\n```json\n{\n  \"embedding\": {\n    \"provider\": \"openai\",\n    \"model\": \"text-embedding-3-small\",\n    \"api_key\": \"your-azure-key\",\n    \"base_url\": \"https://your-resource.openai.azure.com/openai/deployments/your-deployment\"\n  }\n}\n```\n\n## OpenAI-Compatible Endpoints\n\nSetting `base_url` to a non-Azure URL enables any OpenAI-compatible server (Ollama,\nlocal models, Fireworks, etc.). The `model` field must match the server's model name.\n\n# See Also\n\n- [Embedding Pipeline](/algorithms/embedding-pipeline.md)\n- [VoyageAI Embeddings](/providers/voyageai-embeddings.md)\n- [Config System](/config/config-system.md)"}, {"id": "providers/voyageai-embeddings", "type": "Provider", "title": "VoyageAI Embeddings", "description": "voyage-3* provider with batch 128, native reranking, and cross-encoder scoring.", "tags": ["provider", "embedding", "voyageai", "reranking"], "group": "providers", "sz": 32, "body": "# VoyageAI Embedding Provider\n\n**File:** `chunkhound/providers/embeddings/voyageai_provider.py`\n\nVoyageAI is the recommended provider when [multi-hop search](/algorithms/search-multi-hop.md)\nquality matters, because it includes native reranking support via a cross-encoder model.\n\n## Models\n\n| Model | Dimensions | Notes |\n|-------|-----------|-------|\n| `voyage-3` | 1024 | Best quality, higher cost |\n| `voyage-3-lite` | 512 | Faster, cheaper |\n| `voyage-code-3` | 1024 | Code-specific training (recommended for chunkhound) |\n\n## Key Specs\n\n| Parameter | Value |\n|-----------|-------|\n| `batch_size` | 128 texts per API request |\n| `supports_reranking` | \u2705 Yes \u2014 enables [multi-hop search](/algorithms/search-multi-hop.md) |\n| `max_rerank_batch_size` | 1000 (query + document pairs) |\n| `recommended_concurrency` | 4 concurrent batch requests |\n| `distance` | cosine |\n\n## Reranking\n\nVoyageAI's reranker uses a cross-encoder model that scores query-document relevance\nmore accurately than embedding cosine distance. When configured, `SearchService`\nautomatically selects [multi-hop search](/algorithms/search-multi-hop.md).\n\n```python\nresults = await provider.rerank(\n    query=\"authentication middleware\",\n    documents=[chunk.code for chunk in candidates],\n    top_k=20\n)\n# Returns RerankResult(index, score) sorted by score descending\n```\n\n## Input Truncation\n\nVoyageAI truncates inputs that exceed the model's token limit rather than erroring.\nChunkHound relies on [cAST Chunking](/algorithms/cast-chunking.md) to keep chunks\nwithin the limit; the truncation is a safety net, not the primary mechanism.\n\n# See Also\n\n- [Embedding Pipeline](/algorithms/embedding-pipeline.md)\n- [Search \u2014 Multi-hop](/algorithms/search-multi-hop.md)\n- [OpenAI Embeddings](/providers/openai-embeddings.md)"}], EDGES=[{"source": "algorithms/cast-chunking", "target": "architecture/domain-models"}, {"source": "algorithms/cast-chunking", "target": "algorithms/embedding-pipeline"}, {"source": "algorithms/cast-chunking", "target": "components/indexing-coordinator"}, {"source": "algorithms/embedding-pipeline", "target": "algorithms/cast-chunking"}, {"source": "algorithms/embedding-pipeline", "target": "providers/openai-embeddings"}, {"source": "algorithms/embedding-pipeline", "target": "providers/voyageai-embeddings"}, {"source": "algorithms/embedding-pipeline", "target": "architecture/concurrency-model"}, {"source": "algorithms/embedding-pipeline", "target": "components/database-layer"}, {"source": "algorithms/git-diff-search", "target": "algorithms/search-regex"}, {"source": "algorithms/git-diff-search", "target": "algorithms/search-single-hop"}, {"source": "algorithms/git-diff-search", "target": "config/config-system"}, {"source": "algorithms/hybrid-search", "target": "algorithms/search-single-hop"}, {"source": "algorithms/hybrid-search", "target": "algorithms/search-regex"}, {"source": "algorithms/hybrid-search", "target": "algorithms/cast-chunking"}, {"source": "algorithms/hybrid-search", "target": "algorithms/search-multi-hop"}, {"source": "algorithms/search-multi-hop", "target": "algorithms/search-single-hop"}, {"source": "algorithms/search-multi-hop", "target": "algorithms/hybrid-search"}, {"source": "algorithms/search-multi-hop", "target": "components/research-service"}, {"source": "algorithms/search-regex", "target": "algorithms/search-single-hop"}, {"source": "algorithms/search-regex", "target": "algorithms/hybrid-search"}, {"source": "algorithms/search-regex", "target": "components/database-layer"}, {"source": "algorithms/search-single-hop", "target": const PALETTE=["#6E56CF","#D97757","#22C55E","#3B82F6","#EAB308","#EC4899","#14B8A6","#F97316","#A855F7","#0EA5E9","#84CC16","#EF4444","#64748B"];
const byId=Object.fromEntries(NODES.map(n=>[n.id,n]));
const outL={}, inL={};
NODES.forEach(n=>{outL[n.id]=[];inL[n.id]=[];});
EDGES.forEach(e=>{outL[e.source].push(e.target);inL[e.target].push(e.source);});
const types=[...new Set(NODES.map(n=>n.type))].sort();
const color=Object.fromEntries(types.map((t,i)=>[t,PALETTE[i%PALETTE.length]]));
const off=new Set();
const cy=cytoscape({container:document.getElementById('cy'),minZoom:.2,maxZoom:1.6,wheelSensitivity:.2,
 elements:[...NODES.map(n=>({data:{...n,c:color[n.type]}})),...EDGES.map(e=>({data:e}))],
 style:[
  {selector:'node',style:{'background-color':'data(c)','label':'data(title)','color':'#e6e8ee',
   'font-size':10,'text-wrap':'wrap','text-max-width':120,'text-valign':'bottom','text-margin-y':4,
   'text-outline-width':2,'text-outline-color':'#0e0f13','min-zoomed-font-size':6,
   'width':'data(sz)','height':'data(sz)'}},
  {selector:'edge',style:{'width':1.2,'line-color':'#3a4150','target-arrow-color':'#3a4150',

  {selector:'.dim',style:{'opacity':.10}},{selector:'.hl',style:{'border-width':3,'border-color':'#fff'}}
 ],

const side=document.getElementById('side');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function relList(title,arr){if(!arr.length)return'';
 return `<div class="rel"><h4>${title}</h4>${arr.map(id=>`<a data-go="${esc(id)}">${esc((byId[id]||{}).title||id)}</a>`).join('')}</div>`;}
function show(id){const n=byId[id];if(!n)return;const c=color[n.type];
 side.innerHTML=`<span class="type" style="background:${c}">${esc(n.type)}</span>
 <h2>${esc(n.title)}</h2><div class="desc">${esc(n.description)||'<span class=empty>no description</span>'}</div>
 <div class="tags">${(n.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
 ${relList('Links to',outL[id])}${relList('Cited by',inL[id])}
 <div class="body">${n.body?marked.parse(n.body):'<span class=empty>empty body</span>'}</div>`;
 side.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>select(a.getAttribute('data-go')));}
function select(id){const ele=cy.getElementById(id);if(!ele.length)return;show(id);
 cy.elements().removeClass('hl').addClass('dim');const nb=ele.closedNeighborhood();nb.removeClass('dim');ele.addClass('hl');
 cy.animate({center:{eles:ele},duration:250});
 try{if(decodeURIComponent((location.hash||'').slice(1))!==id)location.hash=encodeURIComponent(id);}catch(e){}}
cy.on('tap','node',e=>select(e.target.id()));
cy.on('tap',e=>{if(e.target===cy)cy.elements().removeClass('dim hl');});
function applyFilter(){const q=document.getElementById('search').value.toLowerCase();const ty=document.getElementById('type').value;
 cy.nodes().forEach(n=>{const d=n.data();
  const m=(!q||(d.title+' '+d.type+' '+d.description+' '+(d.tags||[]).join(' ')).toLowerCase().includes(q))
        &&(!ty||d.type===ty)&&!off.has(d.type);
  n.style('display',m?'element':'none');});}
document.getElementById('search').oninput=applyFilter;
document.getElementById('type').oninput=applyFilter;
const tysel=document.getElementById('type');types.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;tysel.appendChild(o);});

document.querySelectorAll('#legend .chip').forEach(ch=>ch.onclick=()=>{const t=ch.getAttribute('data-t');
 if(off.has(t)){off.delete(t);ch.classList.remove('off');}else{off.add(t);ch.classList.add('off');}applyFilter();});

if(QL&&[...document.querySelectorAll('#layout option')].some(o=>o.value===QL)){document.getElementById('layout').value=QL;cy.layout({name:QL,animate:false,padding:40,nodeRepulsion:9000,idealEdgeLength:90}).run();}
