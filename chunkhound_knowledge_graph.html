const NODES=[{"id": "algorithms/cast-chunking", "type": "Algorithm", "title": "cAST Chunking", "description": "AST-based semantic code chunking that splits then greedily merges concept nodes to fit size limits.", "tags": ["algorithm", "chunking", "parsing", "tree-sitter", "ast"], "group": "algorithms", "sz": 41, "body": "# cAST Chunking Algorithm\n\ncAST (Code Abstract Syntax Tree) is ChunkHound's core chunking strategy. It produces semantically coherent chunks by working with the code's actual structure rather than splitting on arbitrary line counts.\n\n**Key files:**\n- `chunkhound/parsers/universal_parser.py` \u2014 main pipeline\n- `chunkhound/parsers/universal_engine.py` \u2014 tree-sitter wrapper\n- `chunkhound/parsers/chunk_splitter.py` \u2014 size enforcement\n- `chunkhound/parsers/concept_extractor.py` \u2014 concept classification\n- `chunkhound/parsers/mappings/` \u2014 language-specific concept maps\n\n## Pipeline\n\n```\nSource file\n    \u2193\n1. TreeSitterEngine.parse(file)\n   \u2192 AST (tree-sitter grammar, 21 languages)\n    \u2193\n2. ConceptExtractor.extract(ast, language)\n   \u2192 List[ConceptNode]  (DEFINITION, COMMENT, BLOCK, STRUCTURE, ...)\n    \u2193\n3. MappingAdapter.map(concepts, language)\n   \u2192 normalized concept list (language-invariant types)\n    \u2193\n4. Greedy merge pass\n   \u2192 merge adjacent compatible concepts while combined size < 80% of max\n    \u2193\n5. ChunkSplitter.enforce(chunks)\n   \u2192 split oversized chunks (line-based, or char-based for minified code)\n    \u2193\nOutput: List[Chunk]\n```\n\n## Concept Types\n\nThe `ConceptExtractor` classifies AST nodes into semantic categories:\n\n| Category | Examples |\n|----------|---------|\n| `DEFINITION` | Function, method, class, struct, interface |\n| `COMMENT` | Line comments, block comments, docstrings |\n| `BLOCK` | Unnamed code blocks, top-level statements |\n| `STRUCTURE` | Module-level groupings, namespaces |\n\nLanguage-specific mappings in `parsers/mappings/` translate tree-sitter node types\nto these universal categories (e.g., `def_statement` in Python \u2192 `DEFINITION`).\n\n## Greedy Merge\n\nAdjacent concept nodes are merged if:\n1. The pair is a **compatible type combination** (COMMENT+DEFINITION, DEFINITION+STRUCTURE, BLOCK+COMMENT)\n2. The combined non-whitespace character count is **< 80% of `max_chunk_size`** (default 960 of 1200)\n\nThis keeps a docstring with its function, a decorator with its class, etc.\n\n## ChunkSplitter \u2014 Size Enforcement\n\n**Config (`CASTConfig`):**\n- `max_chunk_size`: 1200 non-whitespace characters\n- `min_chunk_size`: 50 characters\n- `safe_token_limit`: 6000 tokens (embedding model safety margin)\n- `merge_threshold`: 0.8\n\n**Splitting strategies:**\n1. **Line-based** (default): split at line boundaries, respecting indentation\n2. **Character-based** (fallback for minified code): split at character positions when lines are too long\n\nChunks that exceed `safe_token_limit` (estimated via tiktoken or `chars/4` fallback) are always split regardless of the strategy.\n\n## Why Not Fixed-Size Sliding Windows?\n\nFixed windows cut across function boundaries, leaving incomplete code fragments that\nconfuse embedding models. cAST preserves the semantic units the model was trained on\n(functions, classes, comments) \u2014 this measurably improves retrieval quality.\n\n## Language Support\n\n21 languages via tree-sitter grammars. Special-case parsers for:\n- **Makefile** \u2014 build rules and targets (`parsers/makefile_parser.py`)\n- **YAML** \u2014 faster than generic (`parsers/rapid_yaml_parser.py`)\n- **Vue/Svelte** \u2014 component file parsing (`parsers/vue_parser.py`, `parsers/svelte_parser.py`)\n- **SQL in strings** \u2014 embedded SQL detection (`parsers/embedded_sql_detector.py`)\n\n# See Also\n\n- [Domain Models](/architecture/domain-models.md)\n- [Embedding Pipeline](/algorithms/embedding-pipeline.md)\n- [Indexing Coordinator](/components/indexing-coordinator.md)"}, {"id": "algorithms/embedding-pipeline", "type": "Algorithm", "title": "Embedding Pipeline", "description": "Batched vectorization with skip-existing caching, async concurrency, and provider-specific limits.", "tags": ["algorithm", "embedding", "batching", "caching", "async"], "group": "algorithms", "sz": 37, "body": "# Embedding Pipeline\n\nChunkHound generates vector embeddings for chunks in batches, skipping chunks that\nare already embedded to avoid redundant API calls.\n\n**Key files:**\n- `chunkhound/services/embedding_service.py` \u2014 orchestration\n- `chunkhound/providers/embeddings/openai_provider.py`\n- `chunkhound/providers/embeddings/voyageai_provider.py`\n- `chunkhound/interfaces/embedding_provider.py` \u2014 protocol\n\n## Flow\n\n```\nInput: List[Chunk] (new or changed chunks)\n    \u2193\n1. Fetch existing embeddings\n   get_existing_embeddings(chunk_ids, provider, model)\n   \u2192 Set[ChunkId] already in DB\n    \u2193\n2. Filter to unembedded chunks\n   remaining = [c for c in chunks if c.id not in existing]\n    \u2193\n3. Batch into groups\n   batch_size = provider.batch_size  (OpenAI: 2000, VoyageAI: 128)\n    \u2193\n4. Concurrent API calls (asyncio.gather)\n   max_concurrent = provider.get_recommended_concurrency()\n   Each batch \u2192 provider.embed([chunk.code for chunk in batch])\n    \u2193\n5. Bulk DB insert (5000 embeddings per transaction)\n   DuckDBEmbeddingRepository.bulk_insert(embeddings)\n    \u2193\n6. HNSW index rebuild if > 50 new embeddings added\n```\n\n## Caching \u2014 Skip Already-Embedded\n\n`get_existing_embeddings(chunk_ids, provider, model)` queries the embeddings table\nfor `(chunk_id, provider, model)` tuples. Only chunks with no matching row are sent\nto the API. This means:\n- Re-indexing an unchanged file costs zero API calls.\n- Switching providers requires re-embedding everything.\n- Changing the model name (even minor version) forces re-embedding.\n\n## Provider Interface (key subset)\n\n```python\nclass EmbeddingProvider(Protocol):\n    batch_size: int          # Max texts per API request\n    dims: Dimensions         # Output vector dimension\n\n    async def embed(self, texts: list[str]) -> list[list[float]]: ...\n    def get_recommended_concurrency(self) -> int: ...\n    def supports_reranking(self) -> bool: ...\n    async def rerank(self, query, documents, top_k) -> list[RerankResult]: ...\n```\n\n## Token Safety\n\nBefore batching, each chunk's token count is estimated:\n- If `tiktoken` is available: exact count via the model's tokenizer\n- Fallback: `len(text) / 4` (approximate chars-per-token)\n\nChunks exceeding `safe_token_limit` (6000 tokens) were already split by\n[cAST Chunking](/algorithms/cast-chunking.md) \u2014 the embedding pipeline treats them\nas normal.\n\n## Memory Pre-check\n\nBefore bulk operations, the service checks `psutil.virtual_memory()`. If available\nmemory falls below a threshold, the batch size is reduced to avoid OOM.\n\n# See Also\n\n- [cAST Chunking](/algorithms/cast-chunking.md)\n- [OpenAI Embeddings](/providers/openai-embeddings.md)\n- [VoyageAI Embeddings](/providers/voyageai-embeddings.md)\n- [Concurrency Model](/architecture/concurrency-model.md)\n- [Database Layer](/components/database-layer.md)"}, {"id": "algorithms/git-diff-search", "type": "Algorithm", "title": "Git-diff Search", "description": "Restrict semantic or regex search to files modified in specific commits or commit ranges.", "tags": ["algorithm", "search", "git", "diff", "commits"], "group": "algorithms", "sz": 33, "body": "# Git-diff Search\n\nAllows searches to be scoped to files that were changed in one or more git commits.\nThis is useful for reviewing what changed in a PR, exploring a recent refactor, or\nauditing a specific commit's impact.\n\n**Key files:**\n- `chunkhound/utils/git_safe.py` \u2014 safe git subprocess wrappers\n- `chunkhound/utils/git_discovery.py` \u2014 git repo detection\n- `chunkhound/api/cli/parsers/search_parser.py` \u2014 CLI flag parsing\n\n## CLI Flags\n\n```bash\n# Search last N commits\nchunkhound search \"auth logic\" --last-n 5\n\n# Search a commit range\nchunkhound search \"database migration\" --commit-range HEAD~10..HEAD\n\n# Search a specific commit\nchunkhound search \"bug fix\" --commit-hash abc1234\n```\n\n## Flow\n\n```\n1. Parse git flags from CLI\n    \u2193\n2. Resolve modified files\n   git_safe.get_files_in_commits(repo, flags)\n   \u2192 set of absolute file paths that were touched\n    \u2193\n3. Build path filter from those file paths\n    \u2193\n4. Run standard search (semantic or regex) with path filter applied\n   \u2192 only chunks from modified files are considered\n    \u2193\n5. Return results in normal format\n```\n\n## Implementation Notes\n\n- Git operations are wrapped in `git_safe.py` to handle errors gracefully (non-git\n  directories, missing commits, detached HEAD, etc.) without crashing the search.\n- `git_discovery.py` walks parent directories to find the `.git` root.\n- The path filter is passed to the existing `search_regex_async()` or\n  `search_semantic()` DB methods \u2014 no special code path for git diff results.\n\n## Gotcha: Only Indexed Files Are Searched\n\nThe git diff filter restricts which chunks are returned, but those chunks must\nalready exist in the ChunkHound index. If a modified file was never indexed\n(or was excluded by `.chunkhound.json` ignore patterns), no results are returned\nfor it \u2014 no error is raised.\n\n# See Also\n\n- [Search \u2014 Regex](/algorithms/search-regex.md)\n- [Search \u2014 Single-hop](/algorithms/search-single-hop.md)\n- [Config System](/config/config-system.md)"}, {"id": "algorithms/hybrid-search", "type": "Algorithm", "title": "Hybrid Search", "description": "Weighted combination of semantic and regex search results with deduplication by chunk ID.", "tags": ["algorithm", "search", "hybrid", "scoring", "ranking"], "group": "algorithms", "sz": 33, "body": "# Hybrid Search\n\nCombines [semantic search](/algorithms/search-single-hop.md) and [regex search](/algorithms/search-regex.md) results into a single ranked list. Useful when you want both fuzzy semantic matching and exact symbol/pattern matching.\n\n**Key file:** `chunkhound/services/search_service.py`\n\n## Scoring\n\nEach result gets a normalized score in [0, 1] based on its position and similarity:\n\n```\n# Semantic result at position i (0-indexed) out of N total:\nposition_score    = (N - i) / N\nsimilarity_score  = 1.0 - cosine_distance   (from HNSW index)\nsemantic_score    = 0.3 * position_score + 0.7 * similarity_score\n\n# Regex result at position i out of M total:\nregex_score = (M - i) / M\n```\n\n## Combination\n\n```\ncombined_score = semantic_weight * semantic_score\n               + (1 - semantic_weight) * regex_score\n\n# Default weights:\nsemantic_weight = 0.7\nregex_weight    = 0.3\n```\n\n## Deduplication\n\nA chunk may appear in both the semantic and regex result sets. When a chunk ID is\nfound in both, the **higher score** is kept and the duplicate is discarded.\n\n```python\nseen: dict[ChunkId, float] = {}\nfor result in all_results:\n    if result.chunk_id in seen:\n        seen[result.chunk_id] = max(seen[result.chunk_id], result.score)\n    else:\n        seen[result.chunk_id] = result.score\n```\n\n## Result Enhancement\n\nAfter combining and deduplicating, `ResultEnhancer` post-processes the list:\n- Strips `_partN` suffixes from chunk symbols (artifacts from [ChunkSplitter](/algorithms/cast-chunking.md))\n- Adds `line_count`, `code_preview` (truncated at 500 chars), file extension\n- Formats `similarity` as a percentage (0\u2013100)\n\n# See Also\n\n- [Search \u2014 Single-hop](/algorithms/search-single-hop.md)\n- [Search \u2014 Regex](/algorithms/search-regex.md)\n- [Search \u2014 Multi-hop](/algorithms/search-multi-hop.md)"}, {"id": "algorithms/search-multi-hop", "type": "Algorithm", "title": "Search \u2014 Multi-hop", "description": "Iterative neighbor expansion with reranking for complex queries requiring contextual depth.", "tags": ["algorithm", "search", "multi-hop", "reranking", "expansion"], "group": "algorithms", "sz": 36, "body": "# Multi-hop Search\n\nAn advanced semantic search strategy that iteratively expands from high-scoring\nresults to find contextually related chunks. Used when the embedding provider\nsupports reranking.\n\n**Key file:** `chunkhound/services/search/multi_hop_strategy.py`\n\n## Flow\n\n```\n1. Initial HNSW query \u2192 top 100 candidates\n    \u2193\n2. Rerank candidates\n   provider.rerank(query, [c.code for c in candidates], top_k=100)\n   \u2192 scored list sorted by relevance\n    \u2193\n3. Select top-5 as \"seeds\" for expansion\n    \u2193\n4. For each seed: find its k nearest neighbors in the embedding space\n   (20\u201330 neighbors per seed \u2192 up to 150 additional candidates)\n    \u2193\n5. Rerank all (original + expanded) candidates\n    \u2193\n6. Termination check \u2014 stop if ANY condition met:\n   \u251c\u2500 Time elapsed \u2265 time_limit (default 5.0s)\n   \u251c\u2500 result_count \u2265 result_limit (default 500)\n   \u251c\u2500 Score degradation: top score dropped \u2265 0.15 from previous round\n   \u251c\u2500 Minimum top-5 score < 0.3 (quality gate)\n   \u2514\u2500 Insufficient high-scoring seeds for next expansion\n    \u2193\n7. Return deduplicated, reranked results up to result_limit\n```\n\n## Why Multi-hop?\n\nSingle-hop HNSW finds the nearest vectors, but \"nearest\" in embedding space does not\nalways equal \"most useful for the query.\" Reranking models (Cohere, VoyageAI) have\nricher cross-attention and score query-document pairs more accurately.\n\nExpansion further helps when the answer spans multiple related chunks \u2014 e.g., a\nfunction definition and its callers. Multi-hop surfaces those relationships.\n\n## Termination Conditions\n\nThe algorithm is time-bounded and self-terminating. The 5.0s default prevents runaway\nsearches on large corpora. Score degradation detection avoids expanding into\nirrelevant neighborhoods after the useful cluster is exhausted.\n\n## Configuration\n\n| Parameter | Default | Description |\n|-----------|---------|-------------|\n| `time_limit` | 5.0s | Wall-clock timeout per search |\n| `result_limit` | 500 | Max chunks to accumulate |\n| `expansion_neighbors` | 20\u201330 | Neighbors to fetch per seed |\n| `seeds_per_round` | 5 | Top seeds to expand per iteration |\n| `min_seed_score` | 0.3 | Quality gate for seeds |\n| `score_degradation_threshold` | 0.15 | Stop if top score drops this much |\n\n## When Multi-hop Is Selected\n\n`SearchService` auto-selects multi-hop when `provider.supports_reranking()` returns\n`True`. Providers with reranking: VoyageAI, Cohere, custom endpoints with `/rerank`.\n\n# See Also\n\n- [Search \u2014 Single-hop](/algorithms/search-single-hop.md)\n- [Hybrid Search](/algorithms/hybrid-search.md)\n- [Research Service](/components/research-service.md)"}, {"id": "algorithms/search-regex", "type": "Algorithm", "title": "Search \u2014 Regex", "description": "Pattern matching over raw chunk code using DuckDB's native regexp_matches with optional path filtering.", "tags": ["algorithm", "search", "regex", "duckdb", "pattern-matching"], "group": "algorithms", "sz": 33, "body": "# Regex Search\n\nRegex search matches against the raw `code` field of chunks stored in DuckDB. No\nembedding required \u2014 results are available even before any embedding has been generated.\n\n**Key file:** `chunkhound/providers/database/duckdb_provider.py` \u2014 `_executor_search_regex()`\n\n## SQL Executed\n\n```sql\nSELECT c.id, c.symbol, c.code, c.start_line, c.end_line,\n       c.chunk_type, c.language, f.path\nFROM chunks c\nJOIN files f ON c.file_id = f.id\nWHERE regexp_matches(c.code, ?)          -- pattern parameter\n  AND (? IS NULL OR f.path LIKE '%' || ? || '%')  -- optional path filter\nORDER BY f.path, c.start_line\nLIMIT ? OFFSET ?                         -- pagination\n```\n\n## Features\n\n- **DuckDB `regexp_matches()`** \u2014 PCRE-compatible regex on the full chunk code, not just line-by-line\n- **Path filter** \u2014 narrow results to a directory subtree (e.g., `path=\"src/api\"`)\n- **Sorted output** \u2014 results ordered by file path then line number (predictable, diff-friendly)\n- **Pagination** \u2014 `page_size` and `offset` supported; total count via a separate `COUNT(*)` query\n- **No embedding required** \u2014 works on a freshly indexed repo with no embedding provider configured\n\n## Limitations\n\n- Regex is case-sensitive by default (DuckDB's `regexp_matches` behavior)\n- No ranking by relevance \u2014 results are in file-order, not by match quality\n- For fuzzy or natural-language queries, use [Single-hop Search](/algorithms/search-single-hop.md)\n\n## Use Cases\n\n- Find all usages of a specific function name: `pattern = r\"my_function\\s*\\(\"`\n- Locate TODO/FIXME comments: `pattern = r\"TODO|FIXME\"`\n- Find imports of a module: `pattern = r\"from chunkhound\\.parsers import\"`\n- Combined with path filter: find API endpoints only in `src/api/`\n\n# See Also\n\n- [Hybrid Search](/algorithms/hybrid-search.md)\n- [Search \u2014 Single-hop](/algorithms/search-single-hop.md)\n- [Database Layer](/components/database-layer.md)"}, {"id": "algorithms/search-single-hop", "type": "Algorithm", "title": "Search \u2014 Single-hop", "description": "Standard HNSW top-k vector search for semantic queries without reranking.", "tags": ["algorithm", "search", "hnsw", "vector", "semantic"], "group": "algorithms", "sz": 33, "body": "# Single-hop Search\n\nThe default semantic search strategy. Embeds the query, runs a single HNSW\napproximate nearest-neighbor lookup, and returns the top-k results.\n\n**Key files:**\n- `chunkhound/services/search/single_hop_strategy.py`\n- `chunkhound/providers/database/duckdb_provider.py` \u2014 `_executor_search_semantic()`\n\n## Flow\n\n```\n1. EmbeddingProvider.embed([query_text])\n   \u2192 query_vector: list[float]  (dims = 1536 or 3072)\n    \u2193\n2. DuckDBProvider._executor_search_semantic(query_vector, provider, model, top_k)\n   SQL: SELECT chunk_id, distance FROM embeddings_{dims}\n        ORDER BY array_cosine_distance(vector, ?) LIMIT top_k\n    \u2193\n3. Fetch chunk details (symbol, code, file_path, start_line, end_line)\n    \u2193\n4. Optional: filter by similarity threshold (distance < max_distance)\n    \u2193\n5. Return paginated SearchResult list\n```\n\n## HNSW Index\n\nDuckDB's native HNSW extension (`CREATE INDEX ... USING hnsw`) accelerates the\nnearest-neighbor query. Without the index, the search falls back to an O(N) linear\nscan.\n\nIndex characteristics:\n- **Metric:** cosine distance (default)\n- **Scope:** per-dimension, per-provider, per-model combination\n- **Auto-rebuild:** triggered after bulk inserts (>50 embeddings) for a 12\u00d7 speedup\n- **Query time:** ~5ms for typical corpora\n\n## When Single-hop Is Selected\n\n`SearchService` picks single-hop when the embedding provider does **not** support\nreranking. When reranking is available, [multi-hop search](/algorithms/search-multi-hop.md) is used instead for better recall on complex queries.\n\n## Pagination\n\nResults are paginated with `page_size` (default 20) and `offset`. The total count\nis computed with a separate `COUNT(*)` query so callers can show \"page X of Y\".\n\n# See Also\n\n- [Search \u2014 Multi-hop](/algorithms/search-multi-hop.md)\n- [Hybrid Search](/algorithms/hybrid-search.md)\n- [DuckDB Provider](/providers/duckdb-provider.md)\n- [Embedding Pipeline](/algorithms/embedding-pipeline.md)"}, {"id": "architecture/concurrency-model", "type": "Architecture", "title": "Concurrency Model", "description": "How ChunkHound manages the database single-thread, multi-process parsing, and async embedding.", "tags": ["architecture", "concurrency", "threading", "async", "multiprocessing"], "group": "architecture", "sz": 38, "body": "# Concurrency Model\n\nChunkHound uses three different concurrency primitives for three different workloads.\n\n## Overview\n\n| Layer | Mechanism | Reason |\n|-------|-----------|--------|\n| Database | Single thread (mutex) | DuckDB is not safe for concurrent writes |\n| File parsing | `ProcessPoolExecutor` | CPU-bound; avoids GIL |\n| Embedding API | Async batched | I/O-bound; rate-limit aware |\n| Search | Async (`asyncio`) | Non-blocking result retrieval |\n\n## Database: Single-Threaded via SerialDatabaseProvider\n\n**File:** `chunkhound/providers/database/serial_database_provider.py`\n\nAll database operations pass through a mutex-protected queue that serializes them\nonto a single background thread. This wraps any `DatabaseProvider` implementation.\n\n```python\nprovider = SerialDatabaseProvider(DuckDBProvider(db_path))\n# All calls to provider are queued and executed sequentially\n```\n\nThe consequence: never call database methods from multiple threads without going\nthrough `SerialDatabaseProvider`. Direct access to the underlying `DuckDBProvider`\nfrom async code will cause corruption.\n\n## File Parsing: ProcessPoolExecutor\n\n**File:** `chunkhound/services/indexing_coordinator.py`\n\nParsing is CPU-bound (tree-sitter grammar walking). ChunkHound uses\n`ProcessPoolExecutor` with 4\u201316 workers (auto-scaled by file count).\n\n**Critical:** Linux defaults multiprocessing start method to `fork`, which is unsafe\nwhen combined with asyncio. ChunkHound forces `spawn`:\n\n```python\nimport multiprocessing\nmultiprocessing.set_start_method(\"spawn\", force=True)\n```\n\nWorker functions must be picklable (no lambda, no closure over non-picklable state).\n\n## Embedding: Async Batched\n\n**File:** `chunkhound/services/embedding_service.py`\n\nEmbedding API calls are I/O-bound. The service:\n1. Fetches existing embeddings from DB (skip already-indexed chunks)\n2. Batches remaining chunks into `embedding_batch_size` groups\n3. Sends up to `max_concurrent_batches` requests simultaneously via `asyncio.gather`\n4. Inserts results into DB in bulk (5000 per transaction)\n\nProvider-specific concurrency limits (from `get_recommended_concurrency()`):\n- OpenAI: typically 8 concurrent batches\n- VoyageAI: typically 4 concurrent batches\n\n## Realtime Indexing: Event Queue\n\n**File:** `chunkhound/services/realtime/service.py`\n\nFile change events are buffered in a queue. The realtime service batches mutations\n(100+ at a time) before handing to `IndexingCoordinator`, preventing excessive\nre-embedding on rapid file saves.\n\n## Memory and Disk Guards\n\nBefore bulk embedding operations, the service checks available system memory.\nA configurable disk usage limit prevents runaway indexing from filling the disk.\n\n# See Also\n\n- [Indexing Coordinator](/components/indexing-coordinator.md)\n- [DuckDB Provider](/providers/duckdb-provider.md)\n- [Embedding Pipeline](/algorithms/embedding-pipeline.md)\n- [Realtime Indexing](/components/realtime-indexing.md)"}, {"id": "architecture/dependency-injection", "type": "Architecture", "title": "Dependency Injection", "description": "ProviderRegistry singleton and factory pattern that wires services together.", "tags": ["architecture", "dependency-injection", "registry", "factory"], "group": "architecture", "sz": 37, "body": "# Dependency Injection\n\nChunkHound uses a lightweight registry + factory pattern rather than a full DI\nframework. All providers live in a global `ProviderRegistry` singleton.\n\n## ProviderRegistry\n\n**File:** `chunkhound/registry/__init__.py`\n\n```python\nregistry = ProviderRegistry()  # module-level singleton\n\ndef get_registry() -> ProviderRegistry:\n    return registry\n```\n\nThe registry stores named provider instances and exposes factory methods for services:\n- `registry.get_provider(\"database\")` \u2192 `DatabaseProvider`\n- `registry.get_provider(\"embedding\")` \u2192 `EmbeddingProvider`\n- `registry.create_indexing_coordinator()` \u2192 `IndexingCoordinator`\n- `registry.create_search_service()` \u2192 `SearchService`\n- `registry.create_embedding_service()` \u2192 `EmbeddingService`\n\n## Service Creation Flow\n\n```\n1. Config loaded (CLI args + env + .chunkhound.json)\n        \u2193\n2. registry.configure(config)\n   \u251c\u2500 EmbeddingProviderFactory.create(config.embedding) \u2192 registered as \"embedding\"\n   \u251c\u2500 DatabaseProviderFactory.create(config.database)   \u2192 registered as \"database\"\n   \u2514\u2500 LLMManager.create(config.llm)                    \u2192 registered as \"llm\"\n        \u2193\n3. Command calls registry.create_<service>()\n   \u2514\u2500 Factory pulls providers by name from registry\n      \u2192 constructs service with injected dependencies\n        \u2193\n4. Command uses service (search, index, etc.)\n```\n\n## Lazy Language Parsers\n\n`LazyLanguageParsers` in the registry defers parser instantiation until the first\nfile of each language is processed \u2014 avoids loading tree-sitter grammars for unused languages.\n\n```python\nparsers = registry.get_language_parsers()\n# Only python, javascript etc. parsers that are actually needed are loaded\n```\n\n## DatabaseServices Bundle\n\n**File:** `chunkhound/database_factory.py`\n\nMany commands need the same set of services together, so a `DatabaseServices` named\ntuple bundles them:\n\n```python\nclass DatabaseServices(NamedTuple):\n    provider: DatabaseProvider\n    indexing_coordinator: IndexingCoordinator\n    search_service: SearchService\n    embedding_service: EmbeddingService\n\nservices = create_services(config, db_path, embedding_provider, llm_manager)\n```\n\nThis bundle is the primary entry point for CLI commands and the MCP server.\n\n## Why Not a Full DI Framework?\n\nThe codebase is 100% AI-generated and prioritizes explicitness. The registry pattern\nis straightforward to read and trace \u2014 no magic, no annotations-based injection,\nno container scoping. Services are constructed imperatively and dependencies\nare visible at the call site.\n\n# See Also\n\n- [Provider Plugin System](/architecture/provider-plugin-system.md)\n- [Config System](/config/config-system.md)\n- [Indexing Coordinator](/components/indexing-coordinator.md)"}, {"id": "architecture/domain-models", "type": "Architecture", "title": "Domain Models", "description": "Core data types \u2014 Chunk, File, Embedding \u2014 and their supporting enums.", "tags": ["architecture", "models", "types", "chunk", "embedding"], "group": "architecture", "sz": 39, "body": "# Domain Models\n\nAll models live in `chunkhound/core/models/` and `chunkhound/core/types/`.\n\n## Chunk\n\nThe central unit of ChunkHound. A `Chunk` is an immutable, semantically bounded\nexcerpt of source code extracted by the [cAST algorithm](/algorithms/cast-chunking.md).\n\n```python\n@dataclass(frozen=True)\nclass Chunk:\n    symbol: str              # Function/class name (or file path for top-level blocks)\n    start_line: LineNumber   # 1-indexed\n    end_line: LineNumber\n    code: str                # Raw source text\n    chunk_type: ChunkType    # Semantic classification\n    file_id: FileId          # FK to File\n    language: Language       # Programming language\n    metadata: dict[str, Any] # Provider-specific extras\n    start_byte: ByteOffset | None\n    end_byte: ByteOffset | None\n```\n\n**ChunkType enum** \u2014 40+ values covering:\n- Code definitions: `FUNCTION`, `CLASS`, `METHOD`, `INTERFACE`, `STRUCT`, `ENUM`, `TRAIT`\n- Documentation: `COMMENT`, `DOCSTRING`\n- Structure: `BLOCK`, `MODULE`, `NAMESPACE`, `IMPORT`\n- Language-specific: `HEADER_GUARD`, `MACRO`, `DECORATOR`, `ANNOTATION`\n- Fallback: `CODE_BLOCK` (unnamed top-level code)\n\n## File\n\nTracks source file metadata and change detection.\n\n```python\n@dataclass\nclass File:\n    path: FilePath           # Absolute path\n    language: Language\n    size: int                # Bytes\n    mtime: float             # Modification time (Unix timestamp)\n    hash: str                # SHA-256 of file content (change detection)\n    created_at: Timestamp\n    updated_at: Timestamp\n    id: FileId | None = None # Set after DB insert\n```\n\nHash-based change detection: if `hash` is unchanged, all existing chunks and embeddings are preserved on re-index.\n\n## Embedding\n\nA vector embedding tied to a specific chunk, provider, and model.\n\n```python\n@dataclass\nclass Embedding:\n    chunk_id: ChunkId\n    provider: str            # e.g. \"openai\"\n    model: str               # e.g. \"text-embedding-3-small\"\n    dims: Dimensions         # e.g. 1536\n    vector: list[float]\n    created_at: Timestamp\n```\n\nEmbeddings are keyed on `(chunk_id, provider, model)`. Changing provider or model requires re-embedding all chunks.\n\n## Type Aliases\n\nDefined via `NewType` in `chunkhound/core/types/common.py`:\n\n| Alias | Base | Purpose |\n|-------|------|---------|\n| `ChunkId` | `int` | PK in chunks table |\n| `FileId` | `int` | PK in files table |\n| `FilePath` | `str` | Absolute filesystem path |\n| `LineNumber` | `int` | 1-indexed source line |\n| `ByteOffset` | `int` | Byte position in file |\n| `Timestamp` | `float` | Unix timestamp |\n| `Distance` | `float` | Cosine distance [0, 1] |\n| `Dimensions` | `int` | Embedding vector length |\n\n## Language Enum\n\n21 supported languages: Python, JavaScript, TypeScript, Java, Go, Rust, C, C++, C#, PHP, Ruby, Swift, Kotlin, Scala, Haskell, Lua, R, Julia, SQL, YAML, Makefile.\n\nLanguage detection is file-extension-based via `chunkhound/core/detection/`.\n\n# See Also\n\n- [cAST Chunking](/algorithms/cast-chunking.md)\n- [Database Layer](/components/database-layer.md)\n- [Provider Plugin System](/architecture/provider-plugin-system.md)"}, {"id": "architecture/overview", "type": "Architecture", "title": "System Overview", "description": "End-to-end data flow and component relationships in ChunkHound.", "tags": ["architecture", "overview", "data-flow"], "group": "architecture", "sz": 40, "body": "# System Overview\n\nChunkHound transforms source code into a searchable vector knowledge base and exposes that index through a CLI and an MCP server for AI assistant integration.\n\n## Component Map\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                   Entry Points                       \u2502\n\u2502  CLI (api/cli/main.py)   MCP Server (mcp_server/)   \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n             \u2502                      \u2502\n             \u25bc                      \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502                  Service Layer                      \u2502\n\u2502  IndexingCoordinator   SearchService               \u2502\n\u2502  EmbeddingService      ResearchService             \u2502\n\u2502  RealtimeIndexingService  CodeMapperService        \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n       \u2502                         \u2502\n       \u25bc                         \u25bc\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510   \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502  Parser Layer    \u2502   \u2502       Provider Layer          \u2502\n\u2502  UniversalParser \u2502   \u2502  DatabaseProvider (DuckDB)   \u2502\n\u2502  ChunkSplitter   \u2502   \u2502  EmbeddingProvider (OpenAI)  \u2502\n\u2502  ConceptExtract. \u2502   \u2502  LLMProvider (Anthropic)     \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518   \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n                                 \u2502\n                                 \u25bc\n                        \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n                        \u2502   DuckDB DB    \u2502\n                        \u2502  files/chunks  \u2502\n                        \u2502  /embeddings   \u2502\n                        \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n## End-to-End Indexing Flow\n\n```\n1. File Discovery\n   walk_directory_tree() \u2192 gitignore-aware file list\n\n2. Parallel Parsing (ProcessPoolExecutor, 4\u201316 workers)\n   file \u2192 detect_language() \u2192 UniversalParser.parse() \u2192 [Chunk]\n\n3. Chunk Diffing\n   compare new chunks vs existing DB chunks\n   \u2192 preserve embeddings for unchanged content (10\u00d7 speedup on re-index)\n\n4. Embedding Generation (async batched)\n   fetch_existing_embeddings() \u2192 batch remaining \u2192 concurrent API calls\n\n5. Bulk Storage (5000-record transactions)\n   insert files \u2192 insert chunks \u2192 insert embeddings \u2192 rebuild HNSW index\n```\n\n## End-to-End Search Flow\n\n```\n1. Query arrives (CLI or MCP tool call)\n2. SearchService selects strategy:\n   \u251c\u2500 Regex query \u2192 DuckDB regexp_matches()\n   \u2514\u2500 Semantic query \u2192 EmbeddingProvider.embed(query) \u2192 HNSW top-k\n3. Optional reranking (if provider supports it) \u2192 multi-hop expansion\n4. ResultEnhancer: strip artifacts, add metadata, format scores\n5. Return paginated results\n```\n\n## Key Invariants\n\n- The database runs in a **single dedicated thread** (`SerialDatabaseProvider`) \u2014 DuckDB is not thread-safe for concurrent writes.\n- Parsing is **multi-process** (CPU-bound) \u2014 each worker is independent and picklable.\n- Embedding API calls are **async batched** (I/O-bound) \u2014 concurrent requests up to provider limit.\n- **No stdout in the MCP stdio server** \u2014 breaks the JSON-RPC protocol.\n\n# See Also\n\n- [Domain Models](/architecture/domain-models.md)\n- [Dependency Injection](/architecture/dependency-injection.md)\n- [Concurrency Model](/architecture/concurrency-model.md)\n- [Indexing Coordinator](/components/indexing-coordinator.md)\n- [MCP Server](/components/mcp-server.md)"}, {"id": "architecture/provider-plugin-system", "type": "Architecture", "title": "Provider Plugin System", "description": "Protocol-based extension points for embedding, database, LLM, and search providers.", "tags": ["architecture", "extensibility", "providers", "protocols"], "group": "architecture", "sz": 39, "body": "# Provider Plugin System\n\nChunkHound uses Python structural protocols (duck-typing interfaces) to define\nextension points at every major layer. Adding a new provider means implementing\nthe protocol and registering it \u2014 no base class inheritance required.\n\n## Extension Points\n\n### Embedding Provider\n\n**Protocol:** `chunkhound/interfaces/embedding_provider.py`\n\n```python\nclass EmbeddingProvider(Protocol):\n    name: str\n    model: str\n    dims: Dimensions\n    batch_size: int\n    max_tokens: int\n\n    async def embed(self, texts: list[str]) -> list[list[float]]: ...\n    def supports_reranking(self) -> bool: ...\n    async def rerank(self, query: str, documents: list[str], top_k: int) -> list[RerankResult]: ...\n    def get_recommended_concurrency(self) -> int: ...\n```\n\n**Registration:** Add to `EmbeddingConfig.provider` Literal + `EmbeddingProviderFactory` in `chunkhound/core/config/embedding_factory.py`.\n\n**Existing:** `OpenAIEmbeddingProvider`, `VoyageAIEmbeddingProvider`\n\n### Database Provider\n\n**Protocol:** `chunkhound/interfaces/database_provider.py`\n\nKey methods: `insert_file()`, `insert_chunk()`, `search_regex_async()`, `search_semantic()`, `create_vector_index()`, `drop_vector_index()`.\n\n**Registration:** Add to `DatabaseConfig.provider` Literal + factory.\n\n**Existing:** `DuckDBProvider` (primary), `LanceDBProvider` (alternative), `SerialDatabaseProvider` (thread-safety wrapper)\n\n### LLM Provider\n\n**Protocol:** `chunkhound/interfaces/llm_provider.py`\n\nUsed for query expansion (research service), HyDE, and code documentation synthesis.\n\n**Registration:** Add to `LLMManager._providers` dict in `chunkhound/llm_manager.py`.\n\n**Existing:** Anthropic, OpenAI, Gemini, Grok, OpenAI-compatible, ClaudeCode CLI, Codex CLI, OpenCode CLI\n\n### MCP Tool\n\n**Mechanism:** `@register_tool` decorator in `chunkhound/mcp_server/tools.py`.\n\n```python\n@register_tool(description=\"Search the codebase semantically\", requires_embeddings=True)\nasync def search_semantic(query: str, path: str | None = None, page_size: int = 20) -> dict:\n    ...\n```\n\nJSON Schema is auto-generated from the function signature. Tools are auto-discovered at server startup.\n\n## How Providers Are Wired\n\n```\nConfig (Pydantic)\n  \u2193\nProviderRegistry.configure(config)\n  \u251c\u2500 EmbeddingProviderFactory.create(config.embedding) \u2192 registers embedding provider\n  \u251c\u2500 DatabaseProviderFactory.create(config.database) \u2192 registers DB provider\n  \u2514\u2500 LLMManager.create(config.llm) \u2192 registers LLM provider(s)\n  \u2193\nService factories (create_indexing_coordinator(), create_search_service(), etc.)\n  \u2514\u2500 Pull providers from registry by name \u2192 inject into service constructors\n```\n\n## Adding a New Provider: Checklist\n\n1. Implement the relevant Protocol class\n2. Place file in `chunkhound/providers/<layer>/`\n3. Add the provider name to the config Literal type\n4. Register in the factory (`if config.provider == \"my-provider\": return MyProvider(...)`)\n5. Add smoke test: import + instantiate with test config\n\n# See Also\n\n- [Dependency Injection](/architecture/dependency-injection.md)\n- [DuckDB Provider](/providers/duckdb-provider.md)\n- [OpenAI Embeddings](/providers/openai-embeddings.md)\n- [LLM Providers](/providers/llm-providers.md)"}, {"id": "components/cli", "type": "Component", "title": "CLI", "description": "Command-line interface entry point with lazy-loaded subcommands and unified config wiring.", "tags": ["component", "cli", "subcommands", "argparse"], "group": "components", "sz": 35, "body": "# CLI\n\nChunkHound's command-line interface is the primary way users trigger indexing and search.\n\n**Entry point:** `chunkhound.api.cli.main:main`  \n**File:** `chunkhound/api/cli/main.py`\n\n## Subcommands\n\n| Subcommand | Command file | Purpose |\n|------------|-------------|---------|\n| `index` | `commands/run.py` | Bulk index a directory |\n| `search` | `commands/search.py` | Search the index |\n| `mcp` | `commands/mcp.py` | Start MCP server (stdio or daemon proxy) |\n| `research` | `commands/research.py` | Deep research with LLM synthesis |\n| `map` | `commands/code_mapper.py` | Generate architecture documentation |\n| `autodoc` | `commands/autodoc.py` | Auto-document a codebase |\n| `calibrate` | `commands/calibrate.py` | Tune embedding chunk sizes |\n| `_daemon` | `commands/daemon.py` | Internal multi-client daemon (not public) |\n\n## Lazy Imports\n\nEach command module is imported only when that subcommand is invoked. This keeps\nstartup time fast \u2014 heavy dependencies (DuckDB, tree-sitter, OpenAI SDK) are not\nloaded unless needed.\n\n```python\n# In main.py \u2014 lazy dispatch\nif args.command == \"search\":\n    from chunkhound.api.cli.commands.search import run\n    return await run(args)\n```\n\n## Config Wiring\n\nAll commands use a shared `build_config(args)` factory that reads:\n1. CLI args (highest priority)\n2. Environment variables (`CHUNKHOUND_*`)\n3. `.chunkhound.json` in the target directory\n4. Defaults\n\nThe resulting `Config` object is passed to service factories. See [Config System](/config/config-system.md).\n\n## Key Entry Point Behaviors\n\n- `freeze_support()` called for Windows multiprocessing compatibility\n- `loguru` logging configured (stderr only \u2014 critical for MCP stdio safety)\n- Async main loop started with `asyncio.run()`\n\n## Example Invocations\n\n```bash\n# Index a project\nchunkhound index /path/to/project\n\n# Semantic search\nchunkhound search \"authentication middleware\" /path/to/project\n\n# Regex search\nchunkhound search --regex \"TODO|FIXME\" /path/to/project\n\n# Git-diff search\nchunkhound search \"database schema\" /path/to/project --last-n 5\n\n# Start MCP server\nchunkhound mcp --db /path/to/.chunkhound\n```\n\n# See Also\n\n- [Config System](/config/config-system.md)\n- [MCP Server](/components/mcp-server.md)\n- [Indexing Coordinator](/components/indexing-coordinator.md)"}, {"id": "components/code-mapper", "type": "Component", "title": "Code Mapper", "description": "LLM-driven documentation generation pipeline with coverage tracking and HTML/markdown rendering.", "tags": ["component", "code-mapper", "documentation", "llm", "coverage"], "group": "components", "sz": 34, "body": "# Code Mapper\n\nThe code mapper generates human-readable documentation for the codebase by combining\nchunk retrieval with LLM synthesis. It is exposed as the `map` and `autodoc` CLI commands.\n\n**Key files:**\n- `chunkhound/code_mapper/service.py` \u2014 entry point\n- `chunkhound/code_mapper/pipeline.py` \u2014 orchestration\n- `chunkhound/code_mapper/llm.py` \u2014 LLM doc generation\n- `chunkhound/code_mapper/coverage.py` \u2014 coverage tracking\n- `chunkhound/code_mapper/render.py` \u2014 output rendering\n- `chunkhound/code_mapper/metadata.py` \u2014 source/module tracking\n\n## Pipeline\n\n```\n1. Scope selection\n   User specifies a directory or module (e.g., \"chunkhound/parsers\")\n    \u2193\n2. Chunk retrieval\n   db.get_scope_stats(scope_prefix) \u2192 file count, chunk count\n   db.get_scope_file_paths(scope_prefix) \u2192 list of file paths\n    \u2193\n3. Doc generation (per chunk, batched)\n   LLM (utility model): \"Document this function/class in markdown\"\n   \u2192 docstring, parameter descriptions, return type, examples\n    \u2193\n4. Coverage tracking\n   coverage.py records which symbols have generated docs\n   \u2192 enables incremental runs (skip already-documented chunks)\n    \u2193\n5. Rendering\n   render.py assembles docs into HTML report or markdown files\n   \u2192 one page per module, with navigation sidebar\n```\n\n## Dual-Model Usage\n\nLike the [Research Service](/components/research-service.md), the code mapper uses:\n- **Utility model** for per-chunk documentation (many calls, cheap)\n- **Synthesis model** for module-level summaries (few calls, high quality)\n\n## Output Formats\n\n- **HTML** (`--format html`): self-contained interactive report with navigation\n- **Markdown** (`--format md`): flat markdown files, one per module\n\n## Coverage Semantics\n\nCoverage is tracked in `coverage.py` as a set of `(file_path, symbol)` pairs that\nhave been documented. On subsequent runs, these are skipped. This makes the command\nsafe to interrupt and resume.\n\n# See Also\n\n- [Research Service](/components/research-service.md)\n- [LLM Providers](/providers/llm-providers.md)\n- [Database Layer](/components/database-layer.md)"}, {"id": "components/database-layer", "type": "Component", "title": "Database Layer", "description": "DuckDB-backed storage with HNSW vector index, repository pattern, and thread-safety wrapper.", "tags": ["component", "database", "duckdb", "hnsw", "repository", "schema"], "group": "components", "sz": 39, "body": "# Database Layer\n\nChunkHound uses DuckDB as its primary database. DuckDB provides both relational\n(chunk/file metadata) and vector (embedding) storage in a single embedded file,\neliminating the need for a separate vector database.\n\n**Key files:**\n- `chunkhound/providers/database/duckdb_provider.py` \u2014 main provider\n- `chunkhound/providers/database/duckdb/` \u2014 repository implementations\n- `chunkhound/providers/database/serial_database_provider.py` \u2014 thread-safety wrapper\n\n## Schema\n\n```sql\n-- Source files\nCREATE TABLE files (\n    id       INTEGER PRIMARY KEY,\n    path     TEXT UNIQUE NOT NULL,\n    language TEXT,\n    size     INTEGER,\n    mtime    REAL,\n    hash     TEXT,          -- SHA-256 for change detection\n    created_at REAL,\n    updated_at REAL\n);\n\n-- Code chunks\nCREATE TABLE chunks (\n    id         INTEGER PRIMARY KEY,\n    file_id    INTEGER REFERENCES files(id),\n    symbol     TEXT,\n    code       TEXT,\n    start_line INTEGER,\n    end_line   INTEGER,\n    chunk_type TEXT,\n    language   TEXT,\n    metadata   JSON\n);\n\n-- Embeddings (dimension-specific tables, e.g. embeddings_1536)\nCREATE TABLE embeddings_{dims} (\n    id        INTEGER PRIMARY KEY,\n    chunk_id  INTEGER REFERENCES chunks(id),\n    provider  TEXT,\n    model     TEXT,\n    vector    FLOAT[{dims}]   -- DuckDB array type\n);\n```\n\n## HNSW Vector Index\n\n```sql\nCREATE INDEX hnsw_idx ON embeddings_{dims}\nUSING hnsw (vector)\nWITH (metric = 'cosine');\n```\n\n- Separate index per dimension (1536, 3072, etc.)\n- Built after bulk insert (not maintained incrementally) for efficiency\n- Drop + recreate is faster than incremental updates for >50 embeddings (12\u00d7 speedup)\n- Query: `ORDER BY array_cosine_distance(vector, ?) LIMIT k`\n\n## Repository Pattern\n\nThree repositories encapsulate SQL access:\n\n| Repository | File | Responsibility |\n|------------|------|---------------|\n| `DuckDBFileRepository` | `duckdb/file_repository.py` | File CRUD, hash lookup |\n| `DuckDBChunkRepository` | `duckdb/chunk_repository.py` | Chunk CRUD, bulk insert |\n| `DuckDBEmbeddingRepository` | `duckdb/embedding_repository.py` | Embedding storage, HNSW queries |\n\n## Thread Safety\n\nDuckDB's write connection is not thread-safe. `SerialDatabaseProvider` wraps the\n`DuckDBProvider` in a mutex-protected queue that serializes all operations through\na single background thread. See [Concurrency Model](/architecture/concurrency-model.md).\n\n## WAL Mode and Checkpointing\n\n- WAL (Write-Ahead Log) mode is enabled by default\n- Automatic checkpoint at 1GB WAL size\n- MVCC provides read isolation during writes\n\n## Default DB Path\n\n```\n<project>/.chunkhound/db/chunks.db\n```\n\nOld-style flat `.chunkhound` files (pre-v4) block directory creation \u2014 move aside\nbefore re-indexing if upgrading from an old version.\n\n## Indexed Roots Sidecar\n\nThe provider maintains a sidecar file listing which root paths have been indexed,\npreventing DB corruption when the same DB is used for different project directories.\n\n# See Also\n\n- [DuckDB Provider](/providers/duckdb-provider.md)\n- [Domain Models](/architecture/domain-models.md)\n- [Concurrency Model](/architecture/concurrency-model.md)\n- [.chunkhound.json](/config/dotchunkhound-json.md)"}, {"id": "components/indexing-coordinator", "type": "Component", "title": "Indexing Coordinator", "description": "Central orchestrator for the file-discovery \u2192 parse \u2192 chunk-diff \u2192 embed \u2192 store pipeline.", "tags": ["component", "indexing", "parsing", "pipeline", "orchestration"], "group": "components", "sz": 38, "body": "# Indexing Coordinator\n\nThe `IndexingCoordinator` is the largest service in ChunkHound (~3300 lines) and owns\nthe entire bulk indexing pipeline. It coordinates file discovery, parallel parsing,\nchunk diffing, embedding generation, and storage.\n\n**File:** `chunkhound/services/indexing_coordinator.py`\n\n## Pipeline Stages\n\n### 1. File Discovery\n\n```python\nscan_directory_files(root_path, config)\n```\n\n- Walks the directory tree respecting `.gitignore` patterns\n- Reads `.chunkhound.json` in the target directory to apply custom ignore patterns\n- Returns a list of file paths to process\n\n### 2. Parallel Parsing (ProcessPoolExecutor)\n\n```python\nbatch_processor.parse_files(file_paths, worker_count)\n```\n\n- Auto-scales worker count: 4 workers for <100 files, up to 16 for large repos\n- Each worker: `detect_language(path)` \u2192 `ParserFactory.create(language)` \u2192 `parser.parse(path)` \u2192 `[Chunk]`\n- Workers are isolated processes (spawn start method) \u2014 one crash doesn't kill the pool\n- Returns `List[ParsedFileResult]` with chunks, language, mtime, and file hash\n\n### 3. Chunk Diffing (10\u00d7 speedup on re-index)\n\n```python\ncoordinator.diff_chunks(new_chunks, existing_chunks)\n```\n\nBefore generating embeddings, the coordinator compares new chunks against what's\nalready in the database. If a chunk's `code` is identical (same hash), its existing\nembedding is reused. Only changed or new chunks are sent to the embedding API.\n\nThis is why re-indexing after a small edit costs almost nothing.\n\n### 4. Embedding Generation\n\nDelegates to `EmbeddingService`. See [Embedding Pipeline](/algorithms/embedding-pipeline.md).\n\n### 5. Bulk Storage\n\n```python\ndb.bulk_insert_chunks(chunks, batch_size=5000)\ndb.bulk_insert_embeddings(embeddings, batch_size=5000)\n```\n\n- Transactions are batched at 5000 records to balance memory and commit overhead\n- File records are upserted first (to get `file_id`), then chunks, then embeddings\n- HNSW index is rebuilt after all embeddings are inserted (deferred for efficiency)\n\n## Progress Reporting\n\nThe coordinator uses the `rich` library's `Progress` for hierarchical display:\n- Outer bar: files processed\n- Inner bars: chunks parsed, embeddings generated, records stored\n- Speed: chunks/second and files/second updated in real-time\n\n## Key Invariants\n\n- **Upsert semantics:** if a file exists with the same hash, its chunks are not re-parsed\n- **Orphan cleanup:** chunks from deleted files are removed after each index run\n- **Disk guard:** if the DB grows beyond a configured size limit, indexing pauses\n- **Memory guard:** embedding batches are sized down if available RAM falls below threshold\n\n# See Also\n\n- [cAST Chunking](/algorithms/cast-chunking.md)\n- [Embedding Pipeline](/algorithms/embedding-pipeline.md)\n- [Database Layer](/components/database-layer.md)\n- [Concurrency Model](/architecture/concurrency-model.md)\n- [Realtime Indexing](/components/realtime-indexing.md)"}, {"id": "components/mcp-server", "type": "Component", "title": "MCP Server", "description": "JSON-RPC 2.0 stdio and HTTP transports exposing ChunkHound tools to AI assistants.", "tags": ["component", "mcp", "json-rpc", "stdio", "tools"], "group": "components", "sz": 36, "body": "# MCP Server\n\nChunkHound implements the Model Context Protocol (MCP) to expose search and indexing\ncapabilities to AI assistants like Claude. Two transports are available: stdio (default)\nand HTTP.\n\n**Key files:**\n- `chunkhound/mcp_server/stdio.py` \u2014 stdio JSON-RPC transport\n- `chunkhound/mcp_server/tools.py` \u2014 tool registry and implementations\n- `chunkhound/mcp_server/base.py` \u2014 shared lifecycle management\n- `chunkhound/mcp_server/common.py` \u2014 execution harness\n\n## !! Critical Constraint: No stdout\n\nThe stdio transport uses `stdin`/`stdout` for the JSON-RPC protocol. Any `print()`\nor write to `sys.stdout` in the stdio server (including imported libraries) will\ncorrupt the protocol stream and break the MCP connection.\n\n**All logging must go to stderr only** (loguru is configured this way).\nSWIG warning suppression for DuckDB bindings is also required.\n\n## Tool Registry\n\nTools are registered declaratively with a decorator:\n\n```python\n@register_tool(\n    description=\"Search the codebase semantically or by regex pattern\",\n    requires_embeddings=True\n)\nasync def search(type: str, query: str, path: str | None = None, page_size: int = 20) -> dict:\n    ...\n```\n\nJSON Schema is auto-generated from Python type annotations. Tools are auto-discovered\nat server startup via the registry \u2014 no manual wiring needed.\n\n## Exposed Tools\n\n| Tool | Description | Requires embeddings |\n|------|-------------|---------------------|\n| `search` | Unified regex/semantic search | Semantic only |\n| `code_research` | Multi-hop research with LLM synthesis | Yes |\n| `daemon_status` | Realtime indexing health and progress | No |\n\n## Response Limits\n\nTo prevent context overflow in AI assistants, tool responses are capped:\n- Default: 20k tokens\n- Max: 25k tokens\n\nPaginate with `page_size` and `offset` for large result sets.\n\n## Transports\n\n### Stdio (default)\n\n```bash\nchunkhound mcp\n```\n\nJSON-RPC 2.0 over stdin/stdout. Used by Claude Code, Claude Desktop, and VS Code\nvia `.mcp.json` / `claude_desktop_config.json`.\n\n### HTTP\n\n```bash\nchunkhound mcp http --port 5173\n```\n\nSame tools over HTTP. Useful for web-based tools or debugging with `curl`.\n\n## MCP Client Config Examples\n\n**Claude Code** (`.mcp.json` in project root):\n```json\n{\n  \"mcpServers\": {\n    \"chunkhound\": {\n      \"command\": \"uv\",\n      \"args\": [\"run\", \"chunkhound\", \"mcp\", \"--db\", \"/path/to/.chunkhound\"]\n    }\n  }\n}\n```\n\n# See Also\n\n- [CLI](/components/cli.md)\n- [Search \u2014 Single-hop](/algorithms/search-single-hop.md)\n- [Research Service](/components/research-service.md)\n- [Concurrency Model](/architecture/concurrency-model.md)"}, {"id": "components/realtime-indexing", "type": "Component", "title": "Realtime Indexing", "description": "Filesystem watching with Watchman/watchdog adapters, event batching, and background daemon.", "tags": ["component", "realtime", "watchman", "watchdog", "daemon", "incremental"], "group": "components", "sz": 35, "body": "# Realtime Indexing\n\nChunkHound can watch for file changes and incrementally update the index without a\nfull re-scan. This is the `_daemon` mode, used internally when the MCP server runs\nin persistent mode.\n\n**Key files:**\n- `chunkhound/services/realtime/service.py` \u2014 main realtime service\n- `chunkhound/watchman/` \u2014 Watchman session management\n- `chunkhound/services/realtime/` \u2014 event pipeline\n\n## Adapter Selection (Auto-detected)\n\n```\ndefault_realtime_backend_for_current_install()\n\u2192 \"watchman\"  if Meta's Watchman daemon is installed (optimal for large repos)\n\u2192 \"watchdog\"  if watchdog Python package is available (cross-platform fallback)\n\u2192 \"polling\"   last resort (5\u201310s latency, inefficient)\n```\n\n## Event Flow\n\n```\nFilesystem change detected\n    \u2193\nAdapter emits RealtimeMutation (path, event_type: created|modified|deleted)\n    \u2193\nRealtimePipelineMixin buffers mutations in queue\n    \u2193\nBatch trigger: when \u2265100 mutations buffered OR timeout elapsed\n    \u2193\nIndexingCoordinator.process_batch(mutations)\n  \u251c\u2500 Parse changed files\n  \u251c\u2500 Diff chunks against existing\n  \u251c\u2500 Generate embeddings for new/changed chunks\n  \u2514\u2500 Store in DB, rebuild HNSW index\n    \u2193\nSearch index updated (new content immediately queryable)\n```\n\n## Batching Strategy\n\nThe 100-mutation threshold prevents excessive re-embedding during rapid file saves\n(e.g., IDE auto-save on keystroke). The batch is processed as a unit, so embeddings\nfor 50 changed files are generated in one API call batch rather than 50 sequential calls.\n\n## Daemon Architecture\n\nThe `_daemon` subcommand starts a multi-client proxy that:\n1. Maintains a single `IndexingCoordinator` and DB connection\n2. Accepts MCP tool calls from multiple clients (e.g., multiple Claude sessions)\n3. Serializes DB writes through `SerialDatabaseProvider`\n4. Reports indexing status via the `daemon_status` MCP tool\n\n## Incremental Optimization\n\nThe realtime service inherits the same chunk diffing as [Indexing Coordinator](/components/indexing-coordinator.md):\nif a file's hash is unchanged (e.g., a touch without content change), the service\nskips parsing and embedding entirely \u2014 zero cost.\n\n# See Also\n\n- [Indexing Coordinator](/components/indexing-coordinator.md)\n- [MCP Server](/components/mcp-server.md)\n- [Concurrency Model](/architecture/concurrency-model.md)"}, {"id": "components/research-service", "type": "Component", "title": "Research Service", "description": "Multi-hop BFS semantic exploration with LLM synthesis for deep codebase understanding.", "tags": ["component", "research", "llm", "multi-hop", "synthesis", "bfs"], "group": "components", "sz": 36, "body": "# Research Service\n\nThe research service answers open-ended questions about the codebase by combining\nmulti-hop semantic search with LLM synthesis. It is exposed as the `code_research`\nMCP tool and the `research` CLI command.\n\n**Key files:**\n- `chunkhound/services/deep_research_service.py`\n- `chunkhound/services/research/factory.py` \u2014 service version selector\n\n## Variants\n\n| Variant | File | Strategy |\n|---------|------|----------|\n| v1 | `research/v1/` | Single-shot: embed query \u2192 search \u2192 LLM answer |\n| v3 | `research/v3/` | Multi-hop BFS: explore \u2192 expand \u2192 synthesize |\n\nThe factory (`research/factory.py`) auto-selects based on config \u2014 v3 is default\nwhen an LLM provider is configured.\n\n## v3 Multi-hop BFS Flow\n\n```\n1. Initial search: [Multi-hop Search](/algorithms/search-multi-hop.md) on the query\n    \u2193\n2. LLM \"explorer\" (utility model \u2014 fast, cheap):\n   \"Given these chunks, what sub-questions should I investigate next?\"\n   \u2192 list of follow-up queries\n    \u2193\n3. Parallel search on each follow-up query\n    \u2193\n4. BFS expansion: repeat steps 2\u20133 until:\n   \u251c\u2500 Time budget exhausted\n   \u251c\u2500 No new sub-questions generated\n   \u2514\u2500 Result count saturated\n    \u2193\n5. LLM \"synthesizer\" (synthesis model \u2014 high-quality):\n   \"Given all collected chunks and sub-answers, write a comprehensive answer.\"\n   \u2192 Markdown report with citations to source chunks\n```\n\n## Dual-Model Architecture\n\nThe research service uses two LLM providers simultaneously:\n- **Utility model:** fast and cheap (e.g., Claude Haiku, GPT-4o-mini) \u2014 drives exploration\n- **Synthesis model:** high-quality (e.g., Claude Sonnet, GPT-4o) \u2014 writes the final report\n\nThis splits cost: hundreds of small exploration calls use the cheap model, and only\none synthesis call uses the expensive one.\n\n## HyDE (Hypothetical Document Embeddings)\n\nBefore embedding a research query, the service optionally asks the utility LLM to\ngenerate a hypothetical code snippet that would answer the query. This hypothetical\nsnippet is embedded instead of (or in addition to) the raw query text.\n\nHyDE improves recall for queries phrased in natural language that don't naturally\nshare vocabulary with the code (e.g., \"authentication flow\" \u2192 generates a hypothetical\n`authenticate_user()` function \u2192 embeds that \u2192 finds actual auth code).\n\n# See Also\n\n- [Search \u2014 Multi-hop](/algorithms/search-multi-hop.md)\n- [LLM Providers](/providers/llm-providers.md)\n- [MCP Server](/components/mcp-server.md)"}, {"id": "config/config-system", "type": "Configuration", "title": "Config System", "description": "Pydantic-based config hierarchy with CLI > env > .chunkhound.json > defaults precedence.", "tags": ["configuration", "pydantic", "precedence", "env-vars"], "group": "config", "sz": 35, "body": "# Config System\n\nChunkHound's configuration is a Pydantic `BaseSettings` hierarchy that merges\nsources in a defined precedence order.\n\n**File:** `chunkhound/core/config/config.py`\n\n## Precedence (highest \u2192 lowest)\n\n1. **CLI arguments** \u2014 `--db`, `--model`, `--provider`, etc.\n2. **Environment variables** \u2014 `CHUNKHOUND_EMBEDDING__PROVIDER`, etc.\n3. **Local `.chunkhound.json`** \u2014 in the target directory being indexed\n4. **`--config` file** \u2014 explicit config file path\n5. **Defaults** \u2014 hardcoded in the Pydantic models\n\nA value at a higher level always wins. CLI args cannot be overridden by env vars.\n\n## Sub-config Classes\n\n| Class | Purpose | Key fields |\n|-------|---------|-----------|\n| `DatabaseConfig` | DB backend and path | `provider`, `path` |\n| `EmbeddingConfig` | Vectorization settings | `provider`, `model`, `api_key`, `batch_size` |\n| `IndexingConfig` | Parsing behavior | `max_chunk_size`, `ignore_patterns`, `workers` |\n| `LLMConfig` | LLM for research/docs | `provider`, `utility_model`, `synthesis_model` |\n| `ResearchConfig` | Search strategy tuning | `time_limit`, `result_limit`, `expansion_neighbors` |\n| `MCPConfig` | MCP server settings | `host`, `port`, `mode` |\n\n## Environment Variables\n\nEnvironment variables use double-underscore (`__`) as a delimiter for nested config:\n\n```bash\nCHUNKHOUND_EMBEDDING__PROVIDER=openai\nCHUNKHOUND_EMBEDDING__API_KEY=sk-...\nCHUNKHOUND_EMBEDDING__MODEL=text-embedding-3-small\nCHUNKHOUND_DATABASE__PATH=/path/to/.chunkhound\nCHUNKHOUND_LLM__PROVIDER=anthropic\nCHUNKHOUND_FRAGMENTATION_THRESHOLD_PCT=30\n```\n\n## Loading Pattern\n\n```python\nconfig = Config(args=parsed_args)\n# Config.__init__ reads .chunkhound.json from args.path, applies precedence\nerrors = config.validate_for_command(\"search\")\nif errors:\n    print(errors); sys.exit(1)\n```\n\n## Config Validation\n\nEach config class implements `validate_for_command(command: str)` returning a list\nof validation error messages. Commands call this before creating services, producing\nuser-friendly errors (e.g., \"embedding provider requires OPENAI_API_KEY\").\n\n# See Also\n\n- [.chunkhound.json](/config/dotchunkhound-json.md)\n- [CLI](/components/cli.md)\n- [Dependency Injection](/architecture/dependency-injection.md)"}, {"id": "config/dotchunkhound-json", "type": "Configuration", "title": ".chunkhound.json", "description": "Project-local config file format, DB path resolution, and common gotchas.", "tags": ["configuration", "project-config", "db-path", "gotchas"], "group": "config", "sz": 36, "body": "# .chunkhound.json\n\nA project can include a `.chunkhound.json` at its root to configure ChunkHound\nwithout requiring CLI flags. It is the recommended approach for teams sharing a\nconsistent indexing configuration.\n\n## Format\n\n```json\n{\n  \"database\": {\n    \"provider\": \"duckdb\",\n    \"path\": \".chunkhound\"\n  },\n  \"embedding\": {\n    \"provider\": \"openai\",\n    \"model\": \"text-embedding-3-small\"\n  },\n  \"indexing\": {\n    \"ignore_patterns\": [\"*.log\", \"dist/\", \"node_modules/\"],\n    \"max_chunk_size\": 1200\n  },\n  \"llm\": {\n    \"provider\": \"anthropic\",\n    \"utility_model\": \"claude-haiku-4-5-20251001\",\n    \"synthesis_model\": \"claude-sonnet-4-6\"\n  }\n}\n```\n\nAll fields are optional. Missing fields use defaults or environment variables.\n\n## DB Path Resolution \u2014 Critical Gotchas\n\n### Gotcha 1: `path` is relative to CWD, not the project dir\n\n```json\n{ \"database\": { \"path\": \".chunkhound\" } }\n```\n\nThis resolves to `<CWD>/.chunkhound`, not `<project>/.chunkhound`. When indexing\na remote project from a different working directory, always use `--db` with an\nabsolute path:\n\n```bash\nchunkhound index /path/to/project --db /path/to/project/.chunkhound\n```\n\n### Gotcha 2: `--config` does NOT override a local `.chunkhound.json`\n\nIf the target project has its own `.chunkhound.json`, it takes precedence over a\n`--config` specified file for DB path resolution. Use explicit `--db` to override.\n\n### Gotcha 3: Old-style flat `.chunkhound` files block directory creation\n\nPre-v4 ChunkHound created a flat file at `.chunkhound`. The v4+ format uses a\ndirectory (`.chunkhound/db/chunks.db`). If the old flat file exists, DuckDB\ncannot create the directory \u2014 move it aside before re-indexing:\n\n```bash\nmv .chunkhound .chunkhound.old\nchunkhound index .\n```\n\n### Gotcha 4: `--db` with wrong subpath returns 0 results silently\n\nPassing `--db /project/.chunkhound/db/chunks.db` is fine. Passing\n`--db /project/.chunkhound` (the directory) is also fine \u2014 ChunkHound resolves\nthe `.db` file internally. But passing an incorrect path returns empty results\nwith no error. Always verify with a regex search:\n\n```bash\nchunkhound search --regex \".\" /project --db /path/to/db | head -5\n```\n\n## Default DB Path\n\n```\n<project>/.chunkhound/db/chunks.db\n```\n\nThe path from `.chunkhound.json`'s `database.path` value is what you pass to\n`chunkhound mcp --db`.\n\n# See Also\n\n- [Config System](/config/config-system.md)\n- [Database Layer](/components/database-layer.md)\n- [CLI](/components/cli.md)"}, {"id": "operations/performance", "type": "Reference", "title": "Performance Tuning", "description": "Batch sizing, memory guards, disk limits, spawn mode, and indexing throughput optimization.", "tags": ["operations", "performance", "tuning", "batch-size", "memory"], "group": "operations", "sz": 37, "body": "# Performance Tuning\n\n## Indexing Throughput\n\n### Parser Workers\n\n```python\n# Auto-scaled in indexing_coordinator.py\nworkers = min(16, max(4, file_count // 50))\n```\n\nIncrease for large repos: `CHUNKHOUND_INDEXING__WORKERS=16`\n\n### Embedding Batch Size\n\n| Provider | Default | Max | Set via |\n|----------|---------|-----|---------|\n| OpenAI | 2000 | 2000 | `CHUNKHOUND_EMBEDDING__BATCH_SIZE` |\n| VoyageAI | 128 | 128 | (fixed by provider) |\n\nLarger batches = fewer API round-trips = faster indexing. Don't exceed provider limits.\n\n### DB Insert Batch Size\n\n5000 records per transaction (hardcoded). Changing this affects memory usage\nvs. commit frequency trade-off.\n\n### Concurrent Embedding Batches\n\n```python\nprovider.get_recommended_concurrency()  # default: 8 for OpenAI, 4 for VoyageAI\n```\n\nOverride: `CHUNKHOUND_EMBEDDING__MAX_CONCURRENT_BATCHES=16`\n\n## Memory Guards\n\nBefore bulk embedding:\n\n```python\navailable = psutil.virtual_memory().available\nif available < MIN_FREE_BYTES:\n    batch_size = batch_size // 2  # halve until safe\n```\n\nIf the system is memory-constrained, batch sizes are reduced automatically.\nSet `CHUNKHOUND_INDEXING__MIN_FREE_MEMORY_BYTES` to tune the threshold.\n\n## Disk Limits\n\n`CHUNKHOUND_DATABASE__MAX_SIZE_BYTES` \u2014 if the DuckDB file exceeds this limit,\nindexing pauses and logs a warning. Default: unlimited.\n\n## Multiprocessing Spawn Mode (Linux)\n\nLinux defaults to `fork` for multiprocessing, which is unsafe with asyncio\n(file descriptors, locks, and async state are duplicated inconsistently).\nChunkHound forces `spawn`:\n\n```python\nmultiprocessing.set_start_method(\"spawn\", force=True)\n```\n\nIf you see deadlocks or hangs during indexing, verify this is set:\n\n```python\nimport multiprocessing; print(multiprocessing.get_start_method())\n# should print \"spawn\"\n```\n\n## Re-index Speed\n\nOn a second index run over an unchanged file:\n- **File hash unchanged** \u2192 skip parsing entirely\n- **Chunk unchanged** \u2192 skip embedding API call (reuse existing vector)\n- **Net cost** \u2192 one DB read per file, near-zero for unchanged content\n\nThis 10\u00d7 speedup makes `chunkhound index` safe to run on every CI pass or pre-commit hook.\n\n## HNSW Query Performance\n\n| Corpus size | Query time |\n|-------------|-----------|\n| 10k chunks | ~1ms |\n| 100k chunks | ~5ms |\n| 1M chunks | ~20ms |\n\nIf queries are slow, check: (1) index exists (`SELECT * FROM embedding_indexes`),\n(2) DuckDB HNSW extension is loaded, (3) `SerialDatabaseProvider` is not bottlenecked\nby a long-running write.\n\n# See Also\n\n- [Concurrency Model](/architecture/concurrency-model.md)\n- [Embedding Pipeline](/algorithms/embedding-pipeline.md)\n- [Database Layer](/components/database-layer.md)\n- [Indexing Coordinator](/components/indexing-coordinator.md)"}, {"id": "operations/testing", "type": "Runbook", "title": "Testing", "description": "Mandatory smoke tests, test categories, and the project's testing philosophy.", "tags": ["operations", "testing", "smoke-tests", "pytest", "philosophy"], "group": "operations", "sz": 36, "body": "# Testing\n\n## Mandatory Commands\n\n```bash\n# BEFORE every commit \u2014 smoke tests (~30s)\nuv run pytest tests/test_smoke.py -v -n auto\n\n# BEFORE every PR push \u2014 full suite\nuv run pytest tests/ -v\n\n# Type checking\nuv run mypy chunkhound\n\n# Linting\nuv run ruff check chunkhound\n```\n\nSmoke tests are non-negotiable guardrails. They verify imports, CLI `--help`, and\nserver startup without requiring a running DB or API key.\n\n## Test Categories\n\n| Category | Location | What it covers |\n|----------|----------|---------------|\n| Smoke | `tests/test_smoke.py` | Module imports, CLI help, server startup |\n| Unit | `tests/test_*.py` | Config parsing, provider validation, type boundaries |\n| Integration | `tests/integration/` | End-to-end workflows with real DuckDB |\n| E2E | `tests/e2e/` | Full system with real provider credentials |\n| Config | `tests/config/` | Multi-provider config validation matrix |\n| Realtime | `tests/realtime/` | File watcher behavior |\n| Fixtures | `tests/fixtures/` | Reusable test repos and configs |\n\n## Testing Philosophy\n\nFrom `AGENTS.md` \u2014 these rules govern what tests are written:\n\n1. **Test external constraints and user-facing contracts** \u2014 not internal adapters or mock behavior.\n2. **Do not test** adapters, private helpers, mock behavior, or internal plumbing unless the test is the narrowest way to protect a real external contract.\n3. **Name tests by contract** \u2014 `test_cli_overrides_env`, not `test_extract_cli_overrides_calls_helper`.\n4. **Use real business logic** with fakes only at true external boundaries (network, filesystem, subprocess, third-party APIs).\n5. **For provider integrations** \u2014 test our contract with the provider (supported/unsupported features, request validity, explicit failures). Do NOT test SDK mechanics.\n6. **Before adding a test** \u2014 ask \"Would a user, caller, CI contract, or external system notice if this broke?\" If not, skip it.\n7. **Prefer one higher-value contract test** over many narrow implementation tests.\n\n## Running with Parallelism\n\n```bash\n# Smoke tests \u2014 always run with -n auto (parallel)\nuv run pytest tests/test_smoke.py -v -n auto\n\n# Integration tests \u2014 run sequentially if they share a DB\nuv run pytest tests/integration/ -v\n\n# All tests with timeout (Ubuntu CI uses 18min timeout for Python 3.12)\nuv run pytest tests/ -v --timeout=1080\n```\n\n# See Also\n\n- [Versioning](/operations/versioning.md)\n- [Performance](/operations/performance.md)"}, {"id": "operations/versioning", "type": "Runbook", "title": "Versioning", "description": "hatch-vcs dynamic versioning from git tags, release automation, and pre-release workflow.", "tags": ["operations", "versioning", "hatch-vcs", "release", "pypi", "git-tags"], "group": "operations", "sz": 33, "body": "# Versioning\n\nChunkHound uses **dynamic versioning via hatch-vcs** \u2014 the version is derived from\ngit tags, not from a hardcoded string in `pyproject.toml`. Never manually edit\nversion strings.\n\n## Creating a Release\n\n```bash\n# 1. Tag the version\nuv run scripts/update_version.py 4.2.0\n\n# 2. Run smoke tests (MANDATORY)\nuv run pytest tests/test_smoke.py -v -n auto\n\n# 3. Create and publish a GitHub Release\n#    \u2192 triggers release.yml \u2192 PyPI upload via OIDC Trusted Publishing\n```\n\n## Pre-releases (Alpha/Beta/RC)\n\n```bash\n# Alpha\nuv run scripts/update_version.py 4.2.0a1\n\n# Beta\nuv run scripts/update_version.py 4.2.0b1\n\n# Release candidate\nuv run scripts/update_version.py 4.2.0rc1\n```\n\nPre-releases publish to **PyPI** (not TestPyPI) via `release-rc.yml` on tag push.\n\n## Bumping Version\n\n```bash\n# Semantic bump helpers\nuv run scripts/update_version.py --bump patch    # 4.1.0 \u2192 4.1.1\nuv run scripts/update_version.py --bump minor    # 4.1.0 \u2192 4.2.0\nuv run scripts/update_version.py --bump major    # 4.1.0 \u2192 5.0.0\n\n# Bump + pre-release suffix\nuv run scripts/update_version.py --bump minor b1  # 4.1.0 \u2192 4.2.0b1\n```\n\n## Test Release (Alpha to PyPI)\n\nFor testing the full release pipeline without a production release:\n\n```bash\n# 1. Switch remote to chunkhound org\ngit remote set-url origin https://github.com/chunkhound/chunkhound.git\n\n# 2. Tag alpha\nuv run scripts/update_version.py X.Y.Za1\n\n# 3. Push tag \u2014 triggers release-rc.yml\ngit push origin vX.Y.Za1\n\n# 4. Restore original remote\ngit remote set-url origin <original-url>\n```\n\n## CI/CD\n\n| Workflow | Trigger | Action |\n|----------|---------|--------|\n| `release.yml` | GitHub Release published | Build + publish to PyPI |\n| `release-rc.yml` | Tag push `v*.*.*[a/b/rc]*` | Build + publish pre-release to PyPI |\n| OIDC Trusted Publishing | Both | No manual API key needed |\n\nDo NOT use `uv publish` or `prepare_release.sh` manually \u2014 CI owns the publish step.\n\n# See Also\n\n- [Testing](/operations/testing.md)"}, {"id": "providers/duckdb-provider", "type": "Provider", "title": "DuckDB Provider", "description": "Primary database backend \u2014 relational metadata and HNSW vector search in a single embedded file.", "tags": ["provider", "database", "duckdb", "hnsw", "vector"], "group": "providers", "sz": 36, "body": "# DuckDB Provider\n\n`DuckDBProvider` is ChunkHound's primary (and recommended) database backend. It uses\nDuckDB's embedded columnar engine for both relational chunk metadata and HNSW-indexed\nvector search, eliminating the need for a separate vector store.\n\n**File:** `chunkhound/providers/database/duckdb_provider.py`\n\n## Key Capabilities\n\n| Capability | Implementation |\n|------------|---------------|\n| Relational storage | DuckDB tables (files, chunks, embeddings_N) |\n| Vector similarity | `array_cosine_distance()` + HNSW index |\n| Regex search | `regexp_matches()` native function |\n| Bulk insert | 5000-record transactions |\n| Thread safety | Wrapped in `SerialDatabaseProvider` |\n| WAL mode | Enabled, checkpoint at 1GB |\n\n## HNSW Index Lifecycle\n\n```\nInitial state: no index (linear scan for queries)\n    \u2193\nBulk insert of >50 embeddings\n    \u2193\noptimize_for_bulk=True triggers:\n  1. DROP INDEX IF EXISTS hnsw_idx\n  2. INSERT all embeddings\n  3. CREATE INDEX hnsw_idx USING hnsw(vector) WITH (metric='cosine')\n    \u2193\nQuery time: ~5ms per search (vs O(N) linear scan)\n```\n\nThe drop-then-recreate pattern is intentional \u2014 incremental HNSW updates are slower\nthan rebuilding from scratch when adding many vectors at once.\n\n## Optimization Flags\n\n`optimize_for_bulk: bool` on insert methods triggers batch-optimized paths:\n- Uses dimension-specific embedding tables (one table per dims value)\n- Collects timing metrics for diagnostics\n- Defers HNSW index rebuild until after all embeddings are inserted\n\n## Connection Management\n\n`DuckDBConnectionManager` handles connection lifecycle:\n- Single write connection (enforced by `SerialDatabaseProvider`)\n- Read connections can be multiplexed (DuckDB allows multiple readers)\n- WAL checkpoint is triggered manually after large operations\n\n## Indexed Root Sidecar\n\nA JSON sidecar alongside the DB records which project root(s) the DB covers.\nIf you point `--db` at a DB that was indexed for a different project, the provider\nwarns rather than silently returning wrong results.\n\n## Fragmentation and Compaction\n\nDuckDB handles compaction internally via WAL + MVCC. There is no manual `VACUUM`\nrequired. The `FRAGMENTATION_THRESHOLD_PCT` env var controls when the coordinator\nconsiders the DB fragmented enough to run `CHECKPOINT` explicitly.\n\n# See Also\n\n- [Database Layer](/components/database-layer.md)\n- [Concurrency Model](/architecture/concurrency-model.md)\n- [Config System](/config/config-system.md)\n- [Search \u2014 Single-hop](/algorithms/search-single-hop.md)"}, {"id": "providers/llm-providers", "type": "Provider", "title": "LLM Providers", "description": "LLM backends for research synthesis, doc generation, HyDE, and query expansion.", "tags": ["provider", "llm", "anthropic", "openai", "gemini", "hyde"], "group": "providers", "sz": 36, "body": "# LLM Providers\n\nLLM providers power the [Research Service](/components/research-service.md) and\n[Code Mapper](/components/code-mapper.md). They are optional \u2014 core indexing and\nregex/semantic search work without an LLM.\n\n**Files:** `chunkhound/providers/llm/`, `chunkhound/llm_manager.py`\n\n## Supported Providers\n\n| Provider | Class | Config value |\n|----------|-------|-------------|\n| Anthropic | `AnthropicLLMProvider` | `\"anthropic\"` |\n| OpenAI | `OpenAILLMProvider` | `\"openai\"` |\n| Google Gemini | `GeminiLLMProvider` | `\"gemini\"` |\n| Grok (XAI) | `GrokLLMProvider` | `\"grok\"` |\n| OpenAI-compatible | `OpenAICompatibleLLMProvider` | `\"openai_compatible\"` |\n| Claude Code CLI | `ClaudeCodeCLIProvider` | `\"claude_code\"` |\n| Codex CLI | `CodexCLIProvider` | `\"codex\"` |\n| OpenCode CLI | `OpenCodeCLIProvider` | `\"opencode\"` |\n\nCLI providers (`claude_code`, `codex`, `opencode`) invoke the respective binary\nas a subprocess \u2014 no API key required, useful for local/offline usage.\n\n## Dual-Model Architecture\n\n`LLMManager` maintains two separate LLM provider instances:\n\n```python\nclass LLMManager:\n    utility_provider: LLMProvider   # Fast, cheap \u2014 exploration, follow-ups\n    synthesis_provider: LLMProvider  # High quality \u2014 final output\n```\n\nBoth can be the same provider with different models, or different providers.\nThe [Research Service](/components/research-service.md) routes:\n- BFS sub-queries \u2192 `utility_provider`\n- Final synthesis \u2192 `synthesis_provider`\n\n## HyDE (Hypothetical Document Embeddings)\n\nHyDE uses the `utility_provider` to generate a hypothetical code snippet before\nembedding a natural-language research query:\n\n```\nQuery: \"authentication token validation\"\n    \u2193\nutility_provider: \"Write a Python function that validates authentication tokens\"\n    \u2192 def validate_token(token: str) -> bool: ...\n    \u2193\nembed(hypothetical_code) instead of embed(raw_query)\n    \u2193\nHNSW search finds actual auth code (vocabulary overlap improved)\n```\n\nHyDE is enabled automatically when an LLM provider is configured and the query\nappears to be natural language rather than a code symbol.\n\n## Configuration Example\n\n```json\n{\n  \"llm\": {\n    \"provider\": \"anthropic\",\n    \"utility_model\": \"claude-haiku-4-5-20251001\",\n    \"synthesis_model\": \"claude-sonnet-4-6\",\n    \"api_key\": \"sk-ant-...\"\n  }\n}\n```\n\n# See Also\n\n- [Research Service](/components/research-service.md)\n- [Code Mapper](/components/code-mapper.md)\n- [Provider Plugin System](/architecture/provider-plugin-system.md)"}, {"id": "providers/openai-embeddings", "type": "Provider", "title": "OpenAI Embeddings", "description": "text-embedding-3-* provider with batch 2000, Azure support, tiktoken token counting.", "tags": ["provider", "embedding", "openai", "azure",
